<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <!-- Frame gradient for depth -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="20%" stop-color="#1a1a1a"/>
      <stop offset="80%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="frameSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#444"/>
      <stop offset="15%" stop-color="#1a1a1a"/>
      <stop offset="85%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#444"/>
    </linearGradient>
    <!-- Yellow lightbox glow -->
    <radialGradient id="yellowGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFE54A"/>
      <stop offset="60%" stop-color="#F5C800"/>
      <stop offset="100%" stop-color="#D4A800"/>
    </radialGradient>
    <!-- Off-white enamel -->
    <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2EFE6"/>
      <stop offset="100%" stop-color="#E8E4D8"/>
    </linearGradient>
    <!-- Bolt gradient -->
    <radialGradient id="bolt" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#777"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
  </defs>

  <!-- Outer frame body -->
  <rect x="0" y="0" width="900" height="320" rx="12" ry="12" fill="url(#frameGrad)"/>
  <!-- Side highlight -->
  <rect x="0" y="0" width="900" height="320" rx="12" ry="12" fill="url(#frameSide)" opacity="0.4"/>
  <!-- Inner recess shadow -->
  <rect x="28" y="28" width="844" height="264" rx="6" ry="6" fill="#0a0a0a" opacity="0.8"/>

  <!-- ═══ TOP PANEL: COWLEY ROAD ═══ -->
  <rect x="36" y="36" width="828" height="118" rx="5" ry="5" fill="url(#enamel)"/>
  <!-- Inset border -->
  <rect x="44" y="44" width="812" height="102" rx="3" ry="3"
        fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.6"/>

  <!-- COWLEY ROAD text in serif / humanist style -->
  <text
    x="450" y="112"
    font-family="'Times New Roman', 'Times', Georgia, serif"
    font-size="72"
    font-weight="700"
    fill="#1a1a1a"
    text-anchor="middle"
    letter-spacing="6"
  >COWLEY ROAD</text>

  <!-- ═══ BOTTOM PANEL: STUDIOS lightbox ═══ -->
  <rect x="36" y="166" width="828" height="118" rx="5" ry="5" fill="url(#yellowGlow)"/>
  <!-- Inset border -->
  <rect x="44" y="174" width="812" height="102" rx="3" ry="3"
        fill="none" stroke="#9a7a00" stroke-width="1.5" opacity="0.5"/>

  <!-- STUDIOS text -->
  <text
    x="450" y="242"
    font-family="'Times New Roman', 'Times', Georgia, serif"
    font-size="72"
    font-weight="700"
    fill="#1a1a1a"
    text-anchor="middle"
    letter-spacing="14"
  >STUDIOS</text>

  <!-- ═══ RACK BOLTS — 4 corners + 2 mid sides ═══ -->
  <!-- Top-left -->
  <circle cx="16" cy="16" r="8" fill="url(#bolt)"/>
  <circle cx="16" cy="16" r="4" fill="none" stroke="#555" stroke-width="1"/>
  <line x1="13" y1="16" x2="19" y2="16" stroke="#555" stroke-width="1"/>
  <line x1="16" y1="13" x2="16" y2="19" stroke="#555" stroke-width="1"/>
  <!-- Top-right -->
  <circle cx="884" cy="16" r="8" fill="url(#bolt)"/>
  <circle cx="884" cy="16" r="4" fill="none" stroke="#555" stroke-width="1"/>
  <line x1="881" y1="16" x2="887" y2="16" stroke="#555" stroke-width="1"/>
  <line x1="884" y1="13" x2="884" y2="19" stroke="#555" stroke-width="1"/>
  <!-- Bottom-left -->
  <circle cx="16" cy="304" r="8" fill="url(#bolt)"/>
  <circle cx="16" cy="304" r="4" fill="none" stroke="#555" stroke-width="1"/>
  <line x1="13" y1="304" x2="19" y2="304" stroke="#555" stroke-width="1"/>
  <line x1="16" y1="301" x2="16" y2="307" stroke="#555" stroke-width="1"/>
  <!-- Bottom-right -->
  <circle cx="884" cy="304" r="8" fill="url(#bolt)"/>
  <circle cx="884" cy="304" r="4" fill="none" stroke="#555" stroke-width="1"/>
  <line x1="881" y1="304" x2="887" y2="304" stroke="#555" stroke-width="1"/>
  <line x1="884" y1="301" x2="884" y2="307" stroke="#555" stroke-width="1"/>
  <!-- Mid-left -->
  <circle cx="16" cy="160" r="8" fill="url(#bolt)"/>
  <circle cx="16" cy="160" r="4" fill="none" stroke="#555" stroke-width="1"/>
  <line x1="13" y1="160" x2="19" y2="160" stroke="#555" stroke-width="1"/>
  <line x1="16" y1="157" x2="16" y2="163" stroke="#555" stroke-width="1"/>
  <!-- Mid-right -->
  <circle cx="884" cy="160" r="8" fill="url(#bolt)"/>
  <circle cx="884" cy="160" r="4" fill="none" stroke="#555" stroke-width="1"/>
  <line x1="881" y1="160" x2="887" y2="160" stroke="#555" stroke-width="1"/>
  <line x1="884" y1="157" x2="884" y2="163" stroke="#555" stroke-width="1"/>
</svg>
