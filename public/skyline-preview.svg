<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="880" height="160" style="background:#020d02">

  <!-- Grid -->
  <g stroke="#0f260f" stroke-width="0.5" opacity="0.7">
    <line x1="160" y1="0" x2="160" y2="160"/>
    <line x1="320" y1="0" x2="320" y2="160"/>
    <line x1="480" y1="0" x2="480" y2="160"/>
    <line x1="640" y1="0" x2="640" y2="160"/>
