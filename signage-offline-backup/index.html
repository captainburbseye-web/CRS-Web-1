<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRS Signage Loop - Offline Backup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Signage Container -->
  <div id="signage-loop" class="signage-container">
    <!-- Pixel Shift Container (Burn-in Protection) -->
    <div class="pixel-shift-wrapper">
      
      <!-- Centered Stage -->
      <div class="stage">
        
        <!-- Slide Container -->
        <div id="slide-container" class="slide-container">
          <!-- Slides will be inserted here by script.js -->
        </div>

      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar-track">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
